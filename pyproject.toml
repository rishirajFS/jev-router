[project]
name = "jev-router"
version = "0.1.0"
description = "Outcome-based evaluation of Jev as a cost-aware LLM router"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "anthropic>=1.0",
  "pandas>=2.2",
  "pyarrow>=15",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
ablation = ["fastembed>=0.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
